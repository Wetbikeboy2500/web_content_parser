name: web_query_framework
description: A comprehensive framework for web scraping and parsing in Dart, featuring a custom scripting language (WQL) and support for headless browsers.
version: 1.0.0

publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  # - packages/web_query_framework_headless # You need flutter for this workspace to function properly
  - packages/web_query_framework_headless_interface
  - packages/web_query_framework_util
  - packages/wql_language_server

executables:
  wql: exec

dependencies:
  yaml: ^3.1.0
  path: ^1.8.0
  html: ^0.15.0
  http: ^1.0.0
  json_annotation: ^4.4.0
  equatable: ^2.0.0
  convert: ^3.0.0
  intl: ^0.20.1
  petitparser: ^6.0.0
  web: ^1.0.0
  web_query_framework_headless_interface:
    git:
      url: https://github.com/Wetbikeboy2500/web_query_framework.git
      ref: dev
      path: packages/web_query_framework_headless_interface
  web_query_framework_util:
    git:
      url: https://github.com/Wetbikeboy2500/web_query_framework.git
      ref: dev
      path: packages/web_query_framework_util

dev_dependencies:
  json2yaml: ^3.0.1
  build_runner: ^2.3.3
  json_serializable: ^6.0.1
  lints: ^5.0.0
  test: ^1.17.10
  coverage: ^1.0.3